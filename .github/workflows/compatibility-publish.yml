name: Publish Compatibility Catalog

on:
  workflow_dispatch:
    inputs:
      catalog_path:
        description: Repository-relative approved full Catalog JSON
        type: string
        required: true
        default: compatibility/bootstrap/catalog-v1.json

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: macos-14
    environment: compatibility-publish
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Materialize protected signing key
        env:
          SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY_PEM }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/catalog-signing-key.pem"
      - name: Sign approved exact Catalog bytes
        env:
          CATALOG_SIGNING_KEY_PEM: ${{ runner.temp }}/catalog-signing-key.pem
          CATALOG_SIGNING_KEY_ID: agentmux-catalog-2026-01
          CATALOG_PATH: ${{ inputs.catalog_path }}
        run: scripts/sign-provider-catalog.sh "$CATALOG_PATH" provider-catalog-v1.sig
      - name: Verify signature and release consistency
        env:
          CATALOG_PATH: ${{ inputs.catalog_path }}
        run: |
          cp "$CATALOG_PATH" compatibility/bootstrap/catalog-v1.json
          cp provider-catalog-v1.sig compatibility/bootstrap/catalog-v1.sig
          cargo test --locked --test compatibility_catalog --test catalog_release
          shasum -a 256 "$CATALOG_PATH" provider-catalog-v1.sig > provider-catalog-v1.SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: |
            ${{ inputs.catalog_path }}
            provider-catalog-v1.sig
            provider-catalog-v1.SHA256SUMS
      - name: Publish immutable sequence release and mutable discovery assets
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_PATH: ${{ inputs.catalog_path }}
        run: |
          sequence=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sequence"])' "$CATALOG_PATH")
          tag="compatibility-v1-sequence-$sequence"
          cp "$CATALOG_PATH" provider-catalog-v1.json
          gh release create "$tag" provider-catalog-v1.json provider-catalog-v1.sig provider-catalog-v1.SHA256SUMS --title "$tag" --notes "Approved signed Provider Compatibility Catalog."
          gh release upload compatibility-latest provider-catalog-v1.json provider-catalog-v1.sig --clobber || \
            gh release create compatibility-latest provider-catalog-v1.json provider-catalog-v1.sig --title compatibility-latest --notes "Mutable discovery endpoint; runtime rollback protection remains sequence-based."
