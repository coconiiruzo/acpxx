[package]
name = "acpxx"
version = "2.0.0"
edition = "2024"
rust-version = "1.96"
description = "A handle-first local broker for coding agents over ACP"
license = "Apache-2.0"
repository = "https://github.com/coconiiruzo/acpxx"
keywords = ["acp", "agents", "codex", "claude", "grok"]
categories = ["development-tools"]

[[bin]]
name = "agentmux"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "=2.0.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
libc = "0.2"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
assert_matches = "1.5"

[profile.release]
lto = "thin"
strip = "symbols"
