name: Provider candidate discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Observe candidates without publishing
        id: observe
        run: |
          set -eu
          {
            echo 'body<<EOF'
            echo 'Automated candidate discovery only. No Catalog entry was published.'
            for command in 'grok version' 'cursor-agent --version' 'codex --version' 'claude --version'; do
              printf '\n### `%s`\n\n```text\n' "$command"
              sh -c "$command" 2>&1 || true
              echo '```'
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Open qualification candidate issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.observe.outputs.body }}
        run: gh issue create --title "Provider qualification candidates $(date -u +%F)" --body "$BODY"
