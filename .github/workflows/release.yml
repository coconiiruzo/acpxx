name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Package reproducible artifact
        id: package
        env:
          SOURCE_DATE_EPOCH: "0"
        run: scripts/package-release.sh
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
            dist/agentmux.rb
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.sbom }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
