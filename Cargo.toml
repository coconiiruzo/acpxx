[package]
name = "acpxx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A handle-first local broker for coding agents over ACP"
license = "Apache-2.0"
repository = "https://github.com/coconiiruzo/acpxx"
keywords = ["acp", "agents", "codex", "claude", "grok"]
categories = ["development-tools"]

[dependencies]
agent-client-protocol = "=2.0.0"
clap = { version = "4.5", features = ["derive"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
assert_matches = "1.5"

[profile.release]
lto = "thin"
strip = "symbols"
